name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here touches the API, and npm ci runs install scripts straight out of the PR's package.json.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The checks only read TypeScript, but npm ci still builds node-pty and downloads Electron.
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
