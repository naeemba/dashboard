name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here touches the API, and pnpm install runs onlyBuiltDependencies' scripts straight out of the PR.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Version from packageManager; before setup-node, whose pnpm cache needs it.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # The checks only read TypeScript, but the install still builds node-pty.
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm run lint
      - run: pnpm test

  # Windows is a target since #191. Lint is left to the Ubuntu job: it reads the same files on any platform.
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      # Squirrel only: the other makers are for a mac or Linux. Nothing is published.
      - run: pnpm run make --targets @electron-forge/maker-squirrel
