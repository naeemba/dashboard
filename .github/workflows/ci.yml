name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here touches the API, and npm ci runs install scripts straight out of the PR's package.json.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The checks only read TypeScript, but npm ci still builds node-pty and downloads Electron.
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test

  # Windows is a target since #191. Lint is left to the Ubuntu job: it reads the same files on any platform.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      # forge's make packages without npm's prepackage hook, so put node-pty's binary in place first.
      # Squirrel only: the other makers are for a mac or Linux. Nothing is published.
      - run: node scripts/node-pty-built.mjs
      - run: npx electron-forge make --targets @electron-forge/maker-squirrel
